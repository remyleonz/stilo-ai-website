<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Remy Leon</title>
<meta name="description" content="Remy Leon. Running a sales floor in Miami at 20. We call. They buy. You get paid.">
<meta name="robots" content="noindex, nofollow">
<meta property="og:title" content="Remy Leon">
<meta property="og:description" content="Running a sales floor in Miami at 20. We call. They buy. You get paid.">
<meta property="og:image" content="https://stiloaipartners.com/assets/remyfoundersection.png">
<meta name="theme-color" content="#050505">
<link rel="icon" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=Barlow+Semi+Condensed:ital,wght@0,400;0,500;0,600;0,700&display=swap" rel="stylesheet">
<style>
/* Remy's link-in-bio page. Replaces Linktree. 95% of traffic is a phone coming
   from an Instagram or TikTok bio, so it is a phone page: one 480px column
   letterboxed on a black ground. Black and blood red. Red is an accent (icon
   ring, primary card bar, hover rim, one dot), never a surface. */
:root{
  --page:#050505;--bg:#0B0B0D;--card:#101013;--card-hi:#141418;
  --line:rgba(255,255,255,.08);--line-hi:rgba(255,255,255,.16);
  --fg:#F4F1EA;--fg-2:#cfcabf;--fg-3:#8b877e;
  --red:#8A0303;--red-hi:#B3001B;
  --display:'Bodoni Moda',Georgia,serif;--body:'Barlow Semi Condensed',system-ui,sans-serif;
  --col:480px;--gutter:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;background:var(--page)}
body{font-family:var(--body);background:var(--page);color:var(--fg);line-height:1.45;font-size:17px;-webkit-font-smoothing:antialiased;overflow-x:hidden;min-height:100vh;display:flex;justify-content:center}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
a:focus-visible{outline:2px solid var(--red-hi);outline-offset:3px}

.col{position:relative;width:100%;max-width:var(--col);min-height:100vh;background:var(--bg);display:flex;flex-direction:column;padding-bottom:calc(28px + env(safe-area-inset-bottom))}
@media(min-width:520px){.col{border-inline:1px solid var(--line);box-shadow:0 0 120px -40px rgba(138,3,3,.35)}}

/* hero photo: top 40% of the phone, fading into the page over its last 35% */
.hero{position:relative;height:40vh;height:40svh;min-height:300px;max-height:460px;overflow:hidden;background:#000}
.hero img{width:100%;height:100%;object-fit:cover;object-position:50% 12%}
.hero::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(70% 55% at 50% 100%,rgba(138,3,3,.28) 0%,rgba(138,3,3,0) 70%),
    linear-gradient(to bottom,rgba(11,11,13,0) 62%,rgba(11,11,13,.55) 82%,var(--bg) 100%)}

/* identity */
.id{text-align:center;padding:0 var(--gutter);margin-top:-22px;position:relative}
.id h1{font-family:var(--display);font-optical-sizing:none;font-weight:700;font-size:36px;line-height:1.05;letter-spacing:.005em;color:#fff;text-shadow:0 2px 24px rgba(0,0,0,.6)}
.id .bio{margin-top:10px;font-size:17px;color:var(--fg-2)}
.id .tag{margin-top:6px;font-size:12px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--fg-3)}

/* round icons */
.icons{display:flex;justify-content:center;gap:14px;margin-top:22px;padding:0 var(--gutter)}
.icons a{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;color:var(--fg-2);border:1px solid var(--line-hi);background:rgba(255,255,255,.02);transition:border-color .2s,color .2s,box-shadow .2s,transform .2s}
.icons a svg{width:20px;height:20px;display:block}
.icons a:hover,.icons a:active{border-color:var(--red-hi);color:#fff;box-shadow:0 0 0 3px rgba(179,0,27,.18),0 8px 24px -12px rgba(179,0,27,.6);transform:translateY(-1px)}

/* link cards */
.links{display:grid;gap:12px;margin-top:26px;padding:0 var(--gutter)}
.card{position:relative;display:flex;align-items:center;gap:14px;min-height:68px;padding:12px 16px 12px 18px;border-radius:16px;background:var(--card);border:1px solid var(--line);transition:border-color .2s,background .2s,box-shadow .2s,transform .2s;overflow:hidden}
.card .t{flex:1;min-width:0}
.card .l{font-size:17px;font-weight:600;color:var(--fg);line-height:1.25}
.card .s{font-size:13.5px;color:var(--fg-3);margin-top:3px;line-height:1.3}
.card .g{flex:none;width:18px;height:18px;color:var(--fg-3);transition:color .2s,transform .2s}
.card:hover,.card:active{border-color:rgba(179,0,27,.6);background:var(--card-hi);box-shadow:0 0 0 1px rgba(179,0,27,.18),0 18px 40px -24px rgba(179,0,27,.55);transform:translateY(-1px)}
.card:hover .g,.card:active .g{color:var(--fg);transform:translate(1px,-1px)}
.card.primary{border-color:rgba(179,0,27,.42);padding-left:22px}
.card.primary::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:0 3px 3px 0;background:linear-gradient(to bottom,var(--red-hi),var(--red))}
.card.primary .l{font-size:18px}
.card.primary .s i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--red-hi);margin-right:7px;vertical-align:1px;box-shadow:0 0 0 3px rgba(179,0,27,.2),0 0 12px rgba(179,0,27,.7)}

/* footer */
footer{margin-top:auto;padding:30px var(--gutter) 0;text-align:center;font-size:12px;letter-spacing:.08em;color:var(--fg-3)}

@media(prefers-reduced-motion:reduce){.icons a,.card,.card .g{transition:none}.card:hover,.icons a:hover{transform:none}}
</style>
</head>
<body>
<main class="col">
  <div class="hero"><img id="photo" alt="Remy Leon" fetchpriority="high"></div>
  <div class="id">
    <h1 id="name"></h1>
    <p class="bio" id="bio"></p>
    <p class="tag" id="tagline"></p>
  </div>
  <nav class="icons" id="icons" aria-label="Social"></nav>
  <nav class="links" id="links" aria-label="Links"></nav>
  <footer>STILO AI Partners &middot; Miami</footer>
</main>

<script>
/* =========================================================================
   EDIT HERE. Everything on the page renders from this block.
     name / bio / tagline  the three lines under the photo
     photo                 path under /assets (portrait, face in the top third)
     instagram / tiktok    confirmed handles (@remyaisales on both)
     email                 opens the Mail app
     discord               '' hides the card. Paste the invite link
                           (https://discord.gg/AVXyrR8zf) to show a
                           "Free sales Discord" card after the Instagram card.
   ========================================================================= */
var PROFILE = {
  name: 'Remy Leon',
  bio: 'Running a sales floor in Miami at 20',
  tagline: 'We call. They buy. You get paid.',
  photo: '/assets/remyfoundersection.png',
  instagram: 'https://www.instagram.com/remyaisales/',
  tiktok: 'https://www.tiktok.com/@remyaisales',
  email: 'remyleon@stiloaipartners.com',
  discord: ''
};

/* UTM tags carried onto our own pages so the careers and agency funnels know
   the click came from this page. */
var UTM = '?utm_source=bio&utm_medium=remyaisales';

/* ------------------------------ analytics ------------------------------- */
var SITE = 'remyaisales';
var Q = new URLSearchParams(location.search);
var sid = safeGet(sessionStorage, 'rl_sid'); if (!sid) { sid = rnd(); safeSet(sessionStorage, 'rl_sid', sid); }
var vid = safeGet(localStorage, 'rl_vid'); if (!vid) { vid = rnd(); safeSet(localStorage, 'rl_vid', vid); }
function rnd() { return Math.random().toString(36).slice(2, 10) + Date.now().toString(36); }
function safeGet(s, k) { try { return s.getItem(k); } catch (e) { return null; } }
function safeSet(s, k, v) { try { s.setItem(k, v); } catch (e) {} }

function track(event, extra) {
  var p = { site: SITE, event: event, session_id: sid, visitor_id: vid, lang: 'en',
            path: location.pathname, referrer: document.referrer || null,
            utm_source: Q.get('utm_source'), utm_medium: Q.get('utm_medium'), utm_campaign: Q.get('utm_campaign') };
  if (extra) for (var k in extra) p[k] = extra[k];
  try { fetch('/api/public/funnel-event', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(p), keepalive: true }); } catch (e) {}
}

/* -------------------------------- icons --------------------------------- */
var ICON = {
  instagram: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r=".9" fill="currentColor" stroke="none"/></svg>',
  tiktok: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64 2.93 2.93 0 0 1 .88.13V9.4a6.84 6.84 0 0 0-1-.05A6.33 6.33 0 0 0 5 20.1a6.34 6.34 0 0 0 10.86-4.43v-7a8.16 8.16 0 0 0 4.77 1.52v-3.4a4.85 4.85 0 0 1-1-.1z"/></svg>',
  email: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="m3.5 7 8.5 6.5L20.5 7"/></svg>',
  arrow: '<svg class="g" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9"/></svg>'
};

/* ------------------------------- render --------------------------------- */
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function ext(href) { return /^https?:/.test(href) ? ' target="_blank" rel="noopener"' : ''; }

document.title = PROFILE.name;
document.getElementById('photo').src = PROFILE.photo;
document.getElementById('name').textContent = PROFILE.name;
document.getElementById('bio').textContent = PROFILE.bio;
document.getElementById('tagline').textContent = PROFILE.tagline;

var mailto = 'mailto:' + PROFILE.email;

var icons = [
  { key: 'icon_instagram', label: 'Instagram', href: PROFILE.instagram, svg: ICON.instagram },
  { key: 'icon_tiktok', label: 'TikTok', href: PROFILE.tiktok, svg: ICON.tiktok },
  { key: 'icon_email', label: 'Email', href: mailto, svg: ICON.email }
];
document.getElementById('icons').innerHTML = icons.map(function (i) {
  return '<a href="' + esc(i.href) + '"' + ext(i.href) + ' data-key="' + i.key + '" aria-label="' + esc(i.label) + '">' + i.svg + '</a>';
}).join('');

var cards = [
  { key: 'careers', primary: true, label: "We're hiring callers in Miami", sub: 'Apply in 60 seconds', href: 'https://stiloaipartners.com/careers' + UTM },
  { key: 'agency', label: 'Need more customers? Work with my agency', sub: 'STILO AI Partners', href: 'https://stiloaipartners.com/' + UTM },
  { key: 'tiktok', label: 'TikTok', href: PROFILE.tiktok },
  { key: 'instagram', label: 'Instagram', href: PROFILE.instagram }
];
if (PROFILE.discord) cards.push({ key: 'discord', label: 'Free sales Discord', sub: 'Come hang out', href: PROFILE.discord });
cards.push({ key: 'email', label: 'Email me', sub: PROFILE.email, href: mailto });

document.getElementById('links').innerHTML = cards.map(function (c) {
  var sub = c.sub ? '<div class="s">' + (c.primary ? '<i></i>' : '') + esc(c.sub) + '</div>' : '';
  return '<a class="card' + (c.primary ? ' primary' : '') + '" href="' + esc(c.href) + '"' + ext(c.href) + ' data-key="' + c.key + '">' +
    '<div class="t"><div class="l">' + esc(c.label) + '</div>' + sub + '</div>' + ICON.arrow + '</a>';
}).join('');

/* One beacon per tap. keepalive fetch, so it survives the tab opening and
   never blocks the navigation. */
document.addEventListener('click', function (e) {
  var a = e.target.closest ? e.target.closest('a[data-key]') : null;
  if (a) track('cta_click', { answer: a.getAttribute('data-key') });
});

track('page_view');
</script>
</body>
</html>
