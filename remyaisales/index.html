<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Remy Leon</title>
<meta name="description" content="Remy Leon. Running a sales floor in Miami at 20. We call. They buy. You get paid.">
<meta name="robots" content="noindex, nofollow">
<meta property="og:title" content="Remy Leon">
<meta property="og:description" content="Running a sales floor in Miami at 20. We call. They buy. You get paid.">
<meta property="og:image" content="https://stiloaipartners.com/assets/remy-profile.jpg">
<meta name="theme-color" content="#050505">
<link rel="icon" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..700&family=Barlow+Semi+Condensed:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Remy's link-in-bio page. Replaces Linktree. 95% of traffic is a phone coming
   from an Instagram or TikTok bio, so it is a phone page: one 480px column on
   a black ground. Quiet and soft: no strokes, no boxes, depth comes from
   shadow and a faint inner light. Blood red is the only accent and it lives
   on the primary card alone. */
:root{
  --page:#050505;--bg:#0B0B0D;--surface:#121214;--surface-hi:#17171a;
  --fg:#F4F1EA;--fg-2:#cfcabf;--fg-3:#8f8b82;
  --red:#8A0303;--red-hi:#B3001B;
  --display:'Bodoni Moda',Georgia,serif;--body:'Barlow Semi Condensed',system-ui,sans-serif;
  --col:480px;--gutter:18px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;background:var(--page)}
body{font-family:var(--body);background:var(--page);color:var(--fg);line-height:1.5;font-size:17px;font-weight:400;-webkit-font-smoothing:antialiased;overflow-x:hidden;min-height:100vh;display:flex;justify-content:center}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none;-webkit-tap-highlight-color:transparent}
a:focus-visible{outline:2px solid rgba(179,0,27,.7);outline-offset:4px}

.col{position:relative;width:100%;max-width:var(--col);min-height:100vh;background:var(--bg);display:flex;flex-direction:column;padding-bottom:calc(32px + env(safe-area-inset-bottom))}
@media(min-width:520px){.col{box-shadow:0 0 160px -30px rgba(138,3,3,.28)}}

/* hero photo: top 40% of the phone. The fade starts low (68%) so it never
   covers the face; the name sits just under the photo, not on it */
.hero{position:relative;height:40vh;height:40svh;min-height:300px;max-height:460px;overflow:hidden;background:#000}
.hero img{width:100%;height:100%;object-fit:cover;object-position:50% 15%}
.hero::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(80% 40% at 50% 106%,rgba(138,3,3,.18) 0%,rgba(138,3,3,0) 70%),
    linear-gradient(to bottom,rgba(11,11,13,0) 68%,rgba(11,11,13,.3) 84%,rgba(11,11,13,.8) 95%,var(--bg) 100%)}

/* identity */
.id{text-align:center;padding:0 var(--gutter);margin-top:-6px;position:relative}
.id h1{font-family:var(--display);font-optical-sizing:none;font-weight:700;font-size:38px;line-height:1.05;letter-spacing:.01em;color:#fff;text-shadow:0 2px 28px rgba(0,0,0,.7)}
.id .bio{margin-top:12px;font-size:16px;letter-spacing:.05em;color:var(--fg-2)}
.id .tag{margin-top:6px;font-family:var(--display);font-style:italic;font-weight:400;font-size:18px;letter-spacing:.01em;color:var(--fg-3)}

/* round icons: soft filled discs, no ring */
.icons{display:flex;justify-content:center;gap:16px;margin-top:30px;padding:0 var(--gutter)}
.icons a{position:relative;width:50px;height:50px;border-radius:50%;display:grid;place-items:center;color:#fff;background:rgba(255,255,255,.06);box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 10px 24px -16px rgba(0,0,0,.9);transition:color .25s,background .25s,transform .25s}
.icons a svg{width:22px;height:22px;display:block}
.icons a::after{content:"";position:absolute;left:50%;bottom:-11px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--red-hi);opacity:0;box-shadow:0 0 10px 2px rgba(179,0,27,.6);transition:opacity .25s}
.icons a:hover{color:var(--red-hi);background:rgba(255,255,255,.07);transform:translateY(-1px)}
.icons a:active{color:#fff;background:rgba(255,255,255,.08);transform:translateY(0)}
.icons a:active::after{opacity:1}

/* link cards: soft rounded blocks, no border, centered text */
.links{display:grid;gap:14px;margin-top:32px;padding:0 var(--gutter)}
.card{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:68px;padding:16px 22px;border-radius:26px;background:var(--surface);box-shadow:inset 0 1px 0 rgba(255,255,255,.045),0 14px 34px -22px rgba(0,0,0,.9);transition:transform .25s,box-shadow .25s,background .25s}
.card .l{font-size:17px;font-weight:500;color:var(--fg);line-height:1.3;text-wrap:balance}
.card .s{font-size:14px;color:var(--fg-3);margin-top:3px;line-height:1.35}
.card:hover{background:var(--surface-hi);transform:translateY(-2px);box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 18px 40px -22px rgba(0,0,0,.9),0 22px 60px -30px rgba(179,0,27,.35)}
.card:active{transform:translateY(0);box-shadow:inset 0 1px 0 rgba(255,255,255,.045),0 10px 30px -20px rgba(179,0,27,.5)}
.card.primary{background:radial-gradient(130% 160% at 50% -20%,rgba(179,0,27,.42) 0%,rgba(138,3,3,.22) 38%,var(--surface) 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 22px 60px -28px rgba(179,0,27,.55),0 14px 34px -22px rgba(0,0,0,.9)}
.card.primary .l{font-size:18px;color:#fff}
.card.primary .s{color:rgba(244,241,234,.6)}
.card.primary:hover{background:radial-gradient(130% 160% at 50% -20%,rgba(179,0,27,.6) 0%,rgba(138,3,3,.3) 40%,var(--surface-hi) 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 26px 70px -28px rgba(179,0,27,.7),0 18px 40px -22px rgba(0,0,0,.9)}

/* footer */
footer{margin-top:auto;padding:40px var(--gutter) 0;text-align:center;font-size:13px;color:var(--fg-3)}

@media(prefers-reduced-motion:reduce){.icons a,.card{transition:none}.card:hover,.icons a:hover{transform:none}}
</style>
</head>
<body>
<main class="col">
  <div class="hero"><img id="photo" alt="Remy Leon" fetchpriority="high"></div>
  <div class="id">
    <h1 id="name"></h1>
    <p class="bio" id="bio"></p>
  </div>
  <nav class="icons" id="icons" aria-label="Social"></nav>
  <nav class="links" id="links" aria-label="Links"></nav>
</main>

<script>
/* =========================================================================
   EDIT HERE. Everything on the page renders from this block.
     name / bio             the two lines under the photo
     photo                 path under /assets. Portrait, face in the top
                           third. remy-profile.jpg is the 1200px web copy
                           of remy-profile.jpeg.
     instagram / tiktok    confirmed handles (@remyaisales on both)
     email                 opens the Mail app
     discord               '' hides the card. Paste the invite link
                           (https://discord.gg/AVXyrR8zf) to show a
                           "Free sales Discord" card after the Instagram card.
   ========================================================================= */
var PROFILE = {
  name: 'Remy Leon',
  bio: 'Running a sales floor in Miami at 20',
  photo: '/assets/remy-profile.jpg',
  instagram: 'https://www.instagram.com/remyaisales/',
  tiktok: 'https://www.tiktok.com/@remyaisales',
  email: 'remyleon@stiloaipartners.com',
  discord: ''
};

/* UTM tags carried onto our own pages so the careers and agency funnels know
   the click came from this page. */
var UTM = '?utm_source=bio&utm_medium=remyaisales';

/* ------------------------------ analytics ------------------------------- */
var SITE = 'remyaisales';
var Q = new URLSearchParams(location.search);
var sid = safeGet(sessionStorage, 'rl_sid'); if (!sid) { sid = rnd(); safeSet(sessionStorage, 'rl_sid', sid); }
var vid = safeGet(localStorage, 'rl_vid'); if (!vid) { vid = rnd(); safeSet(localStorage, 'rl_vid', vid); }
function rnd() { return Math.random().toString(36).slice(2, 10) + Date.now().toString(36); }
function safeGet(s, k) { try { return s.getItem(k); } catch (e) { return null; } }
function safeSet(s, k, v) { try { s.setItem(k, v); } catch (e) {} }

function track(event, extra) {
  var p = { site: SITE, event: event, session_id: sid, visitor_id: vid, lang: 'en',
            path: location.pathname, referrer: document.referrer || null,
            utm_source: Q.get('utm_source'), utm_medium: Q.get('utm_medium'), utm_campaign: Q.get('utm_campaign') };
  if (extra) for (var k in extra) p[k] = extra[k];
  try { fetch('/api/public/funnel-event', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(p), keepalive: true }); } catch (e) {}
}

/* -------------------------------- icons --------------------------------- */
var ICON = {
  instagram: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5.5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r=".9" fill="currentColor" stroke="none"/></svg>',
  tiktok: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64 2.93 2.93 0 0 1 .88.13V9.4a6.84 6.84 0 0 0-1-.05A6.33 6.33 0 0 0 5 20.1a6.34 6.34 0 0 0 10.86-4.43v-7a8.16 8.16 0 0 0 4.77 1.52v-3.4a4.85 4.85 0 0 1-1-.1z"/></svg>',
  email: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m3.5 7 8.5 6.5L20.5 7"/></svg>'
};

/* ------------------------------- render --------------------------------- */
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function ext(href) { return /^https?:/.test(href) ? ' target="_blank" rel="noopener"' : ''; }

document.title = PROFILE.name;
document.getElementById('photo').src = PROFILE.photo;
document.getElementById('name').textContent = PROFILE.name;
document.getElementById('bio').textContent = PROFILE.bio;

var mailto = 'mailto:' + PROFILE.email;

var icons = [
  { key: 'icon_instagram', label: 'Instagram', href: PROFILE.instagram, svg: ICON.instagram },
  { key: 'icon_tiktok', label: 'TikTok', href: PROFILE.tiktok, svg: ICON.tiktok },
  { key: 'icon_email', label: 'Email', href: mailto, svg: ICON.email }
];
document.getElementById('icons').innerHTML = icons.map(function (i) {
  return '<a href="' + esc(i.href) + '"' + ext(i.href) + ' data-key="' + i.key + '" aria-label="' + esc(i.label) + '">' + i.svg + '</a>';
}).join('');

var cards = [
  { key: 'careers', primary: true, label: "We're hiring sales reps", sub: 'Remote, paid on every sale. Apply in 60 seconds', href: 'https://stiloaipartners.com/careers' + UTM },
  { key: 'agency', label: 'B2B company that needs more clients?', sub: 'We fill your sales calendar. STILO AI PARTNERS', href: 'https://stiloaipartners.com/' + UTM },
];
if (PROFILE.discord) cards.push({ key: 'discord', label: 'Free sales Discord', sub: 'Come hang out', href: PROFILE.discord });

document.getElementById('links').innerHTML = cards.map(function (c) {
  var sub = c.sub ? '<div class="s">' + esc(c.sub) + '</div>' : '';
  return '<a class="card' + (c.primary ? ' primary' : '') + '" href="' + esc(c.href) + '"' + ext(c.href) + ' data-key="' + c.key + '">' +
    '<div class="l">' + esc(c.label) + '</div>' + sub + '</a>';
}).join('');

/* One beacon per tap. keepalive fetch, so it survives the tab opening and
   never blocks the navigation. */
document.addEventListener('click', function (e) {
  var a = e.target.closest ? e.target.closest('a[data-key]') : null;
  if (a) track('cta_click', { answer: a.getAttribute('data-key') });
});

track('page_view');
</script>
</body>
</html>
