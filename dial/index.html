<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#07070b">
<title>STILO Dialer — Phone</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/assets/dial-companion.js"></script>
<style>
/* Standalone shell for the shared handset (assets/dial-companion.js).
   Reps who come through the SDR dashboard's Dialer tab never see this
   page; it exists for the short URL — one login, then the same view. */
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body { margin:0; background:radial-gradient(120% 80% at 50% 0%, #0b0c14 0%, #07070b 55%); color:#ecedf2; font-family:-apple-system,system-ui,sans-serif; min-height:100vh; min-height:100dvh; display:flex; flex-direction:column; -webkit-font-smoothing:antialiased; }
.shell { flex:1; display:flex; flex-direction:column; max-width:480px; margin:0 auto; width:100%; padding:calc(18px + env(safe-area-inset-top)) 22px calc(20px + env(safe-area-inset-bottom)); }
.topbar { display:flex; align-items:center; justify-content:space-between; }
.brand { font-family:ui-monospace,Menlo,monospace; font-size:11px; font-weight:700; letter-spacing:.24em; color:#2563EB; }
.who { font-size:11.5px; color:#565866; }
#host { flex:1; display:flex; flex-direction:column; }

/* login */
.login { flex:1; display:flex; flex-direction:column; justify-content:center; gap:12px; animation:in .35s ease both; }
@keyframes in { from{opacity:0;transform:translateY(10px);} to{opacity:1;transform:none;} }
.login h1 { font-size:27px; font-weight:700; letter-spacing:-.015em; line-height:1.18; margin:0 0 4px; }
.login p { font-size:14px; line-height:1.65; color:#8a8c9c; margin:0 0 14px; }
input { width:100%; padding:16px 17px; background:rgba(255,255,255,.05); border:none; border-radius:14px; color:#ecedf2; font-size:16px; font-family:inherit; outline:none; }
input:focus { background:rgba(255,255,255,.08); box-shadow:0 0 0 1.5px rgba(37,99,235,.6); }
input::placeholder { color:#565866; }
.go { width:100%; padding:17px; margin-top:6px; background:linear-gradient(180deg,#3070f0,#2058d4); color:#fff; border:none; border-radius:16px; font-size:16px; font-weight:700; font-family:inherit; cursor:pointer; box-shadow:0 14px 40px rgba(37,99,235,.3), inset 0 1px 0 rgba(255,255,255,.18); transition:transform .08s ease; }
.go:active { transform:scale(.97); }
.err { color:#f87171; font-size:13px; min-height:17px; }
.fine { font-size:11.5px; color:#565866; text-align:center; line-height:1.6; }
.hide { display:none !important; }
</style>
</head>
<body>
<div class="shell">
  <div class="topbar">
    <div class="brand">STILO DIALER</div>
    <div class="who" id="who"></div>
  </div>

  <div class="login hide" id="viewLogin">
    <h1>Your phone is<br>the handset.</h1>
    <p>Sign in once with your dashboard login. After that, every call your laptop lines up shows here as one tap.</p>
    <input id="email" type="email" placeholder="Work email" autocomplete="username" autocapitalize="none">
    <input id="pw" type="password" placeholder="Password" autocomplete="current-password">
    <div class="err" id="loginErr"></div>
    <button class="go" onclick="doLogin()">Sign in</button>
    <div class="fine">Tip: you can also use the Dialer tab in your SDR dashboard.</div>
  </div>

  <div id="host"></div>
</div>

<script>
var SUPABASE_URL = 'https://zsrskphpvgautfgklgxf.supabase.co';
var SUPABASE_ANON_KEY = 'sb_publishable_exRKfUY8b_1Dj5GaQsSwdA_KJG_ZtT3';
var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

async function token() {
  var s = await sb.auth.getSession();
  return s && s.data && s.data.session ? s.data.session.access_token : null;
}

// Same contract the dashboards use: parsed JSON back, throw with .status
// on a non-2xx so DIAL_COMPANION can catch a 401 and bounce to login.
async function fetchJson(path) {
  var t = await token();
  if (!t) { var e0 = new Error('no_session'); e0.status = 401; throw e0; }
  var res = await fetch(path, { headers: { Authorization: 'Bearer ' + t } });
  if (res.status === 401) {
    await sb.auth.refreshSession();
    var e1 = new Error('unauthorized'); e1.status = 401; throw e1;
  }
  if (!res.ok) { var e2 = new Error('http_' + res.status); e2.status = res.status; throw e2; }
  return res.json();
}

function showLogin() {
  document.getElementById('viewLogin').classList.remove('hide');
  document.getElementById('who').textContent = '';
}

async function doLogin() {
  var errEl = document.getElementById('loginErr');
  errEl.textContent = '';
  var email = document.getElementById('email').value.trim();
  var pw = document.getElementById('pw').value;
  if (!email || !pw) { errEl.textContent = 'Email and password, both.'; return; }
  var r = await sb.auth.signInWithPassword({ email: email, password: pw });
  if (r.error) { errEl.textContent = r.error.message || 'Sign-in failed.'; return; }
  boot();
}

var authFails = 0;
async function boot() {
  var t = await token();
  if (!t) { showLogin(); return; }
  document.getElementById('viewLogin').classList.add('hide');
  var u = await sb.auth.getUser();
  document.getElementById('who').textContent = (u && u.data && u.data.user && u.data.user.email) || '';
  authFails = 0;
  DIAL_COMPANION.mount({
    host: 'host',
    fetchJson: fetchJson,
    // One refresh attempt happens inside fetchJson; if auth is truly gone
    // (revoked, password change) fall back to the login form.
    onAuthLost: function () {
      authFails++;
      if (authFails > 2) { showLogin(); return; }
      setTimeout(boot, 1200);
    }
  });
}

document.getElementById('pw').addEventListener('keydown', function (e) { if (e.key === 'Enter') doLogin(); });
boot();
</script>
</body>
</html>
