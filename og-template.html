<!DOCTYPE html>
<!--
  OG image template (1200x630). Mirrors the live hero: the booked calendar as
  the backdrop, the wordmark, and the hero headline. No body copy on purpose,
  it is unreadable at share-card size. Rendered to og-image.png by
  scripts/build_og_image.py, which screenshots the real #gcal first.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,600;6..96,700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:630px;overflow:hidden;background:#07070A}
  .og{position:relative;width:1200px;height:630px;overflow:hidden;background:#07070A}

  /* the real calendar, pushed back so it reads as texture not content */
  .cal{position:absolute;left:50%;top:96px;transform:translateX(-50%);
       width:1180px;border-radius:14px;overflow:hidden;opacity:.62;
       box-shadow:0 60px 120px -40px rgba(0,0,0,.9)}
  .cal img{display:block;width:100%;height:auto}

  /* navy wash + bottom scrim so the headline always sits on solid ink */
  .glow{position:absolute;left:-10%;top:-28%;width:900px;height:620px;border-radius:50%;
        background:radial-gradient(ellipse at center,rgba(20,52,140,.42),transparent 66%);filter:blur(70px)}
  .glow2{position:absolute;right:-14%;top:6%;width:860px;height:600px;border-radius:50%;
        background:radial-gradient(ellipse at center,rgba(10,46,133,.40),transparent 68%);filter:blur(70px)}
  .scrim{position:absolute;inset:0;
    background:linear-gradient(180deg,rgba(7,7,10,.72) 0%,rgba(7,7,10,.36) 26%,rgba(7,7,10,.86) 62%,#07070A 88%)}

  .wordmark{position:absolute;top:46px;left:64px;height:44px;width:auto;
            filter:brightness(1.24) saturate(1.05) drop-shadow(0 2px 10px rgba(0,0,0,.6))}

  .headline{position:absolute;left:64px;right:64px;bottom:112px;
    font-family:'Bodoni Moda',Georgia,serif;font-optical-sizing:none;font-weight:700;
    font-size:78px;line-height:1.02;letter-spacing:.012em;text-transform:uppercase;color:#F4F1EA;
    text-shadow:0 4px 40px rgba(0,0,0,.85)}

  .foot{position:absolute;left:66px;bottom:62px;display:flex;align-items:center;gap:14px;
    font-family:'Bodoni Moda',Georgia,serif;font-weight:600;font-size:21px;letter-spacing:.06em;
    text-transform:uppercase;color:#8b877e}
  .foot i{display:block;width:26px;height:2px;background:#2F5FE3;font-style:normal}
</style>
</head>
<body>
  <div class="og">
    <div class="cal"><img src="og-cal.png" alt=""></div>
    <div class="glow"></div>
    <div class="glow2"></div>
    <div class="scrim"></div>
    <img class="wordmark" src="assets/StiloLogoOfficial.webp" alt="">
    <div class="headline">Qualified meetings<br>on your calendar</div>
    <div class="foot"><i></i>stiloaipartners.com</div>
  </div>
</body>
</html>
